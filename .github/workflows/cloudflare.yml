# Calls the Cloudflare API with the CLOUDFLARE_API_TOKEN secret.
# The token never leaves GitHub. Run with:
#   gh workflow run cloudflare.yml --repo metaseonso/infra -f method=GET -f path=zones
name: cloudflare

on:
  workflow_dispatch:
    inputs:
      method:
        description: HTTP method (GET, POST, PUT, PATCH, DELETE)
        required: true
        default: GET
      path:
        description: API path after https://api.cloudflare.com/client/v4/
        required: true
      body:
        description: JSON body (optional)
        required: false
        default: ""

permissions: {}

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Call the Cloudflare API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          METHOD: ${{ inputs.method }}
          API_PATH: ${{ inputs.path }}
          BODY: ${{ inputs.body }}
        run: |
          set -euo pipefail
          case "$METHOD" in GET|POST|PUT|PATCH|DELETE) ;; *) echo "bad method: $METHOD"; exit 1 ;; esac
          args=(-sS -X "$METHOD" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json")
          if [ -n "$BODY" ]; then args+=(--data "$BODY"); fi
          curl "${args[@]}" "https://api.cloudflare.com/client/v4/${API_PATH#/}" | jq .
