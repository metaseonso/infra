# Deploys the outside watcher (watcher/worker.js) to Cloudflare Workers, with a cron every 2 minutes.
# Run: gh workflow run watcher.yml --repo metaseonso/infra
# Secrets used (never printed): CLOUDFLARE_API_TOKEN, CIRCLE_TELEGRAM_TOKEN, SUMMONER_CHAT_ID.
name: watcher

on:
  workflow_dispatch:
    inputs:
      inspect:
        description: Only show the watcher's state and schedule (no deploy)
        required: false
        default: "no"
  push:
    branches: [main]
    paths: [watcher/**, .github/workflows/watcher.yml]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the watcher
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.CIRCLE_TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.SUMMONER_CHAT_ID }}
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          # Every Cloudflare answer is checked; on failure only its error messages are shown (no ids).
          need() { if [ "$(jq -r .success <<<"$2")" != true ]; then echo "$1 failed: $(jq -c '[.errors[]?.message]' <<<"$2")"; exit 1; fi; }
          r=$(api https://api.cloudflare.com/client/v4/accounts); need "list accounts" "$r"
          CLOUDFLARE_ACCOUNT_ID=$(jq -r '.result[0].id' <<<"$r")
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          export CLOUDFLARE_ACCOUNT_ID
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          r=$(api "$base?per_page=100"); need "list KV namespaces" "$r"
          ns=$(jq -r '.result[] | select(.title=="circle-watch-state") | .id' <<<"$r")
          if [ -z "$ns" ]; then
            r=$(api -X POST "$base" --data '{"title":"circle-watch-state"}'); need "create KV namespace" "$r"
            ns=$(jq -r '.result.id' <<<"$r")
          fi
          echo "::add-mask::$ns"
          if [ "${{ inputs.inspect }}" = "yes" ]; then
            echo "state: $(api "$base/$ns/values/state")"
            r=$(api "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/circle-watch/schedules")
            echo "schedules: $(jq -c '{success, errors: [.errors[]?.message], crons: [.result.schedules[]?.cron]}' <<<"$r")"
            exit 0
          fi
          cd watcher
          cat > wrangler.toml <<EOF
          name = "circle-watch"
          main = "worker.js"
          compatibility_date = "2026-10-01"
          workers_dev = false
          [vars]
          HEALTH_URL = "https://circle.mushin.space/health"
          [[kv_namespaces]]
          binding = "STATE"
          id = "$ns"
          [triggers]
          crons = ["*/2 * * * *"]
          EOF
          sed -i 's/^          //' wrangler.toml
          # Wrangler's own output can name the account; keep only lines without ids, but keep its exit status.
          quiet() { "$@" > /tmp/out.txt 2>&1 && st=0 || st=$?; { grep -vE "[0-9a-f]{32}" /tmp/out.txt || true; }; return $st; }
          quiet npx --yes wrangler@4.20.0 deploy
          jq -n --arg t "$BOT_TOKEN" --arg c "$CHAT_ID" '{BOT_TOKEN: $t, CHAT_ID: $c}' > /tmp/s.json
          quiet npx --yes wrangler@4.20.0 secret bulk /tmp/s.json
          rm -f /tmp/s.json
          echo "watcher deployed"
